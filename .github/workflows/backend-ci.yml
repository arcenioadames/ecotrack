name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ecotrack:ecotrack@localhost:5432/ecotrack_test
      DIRECT_URL: postgresql://ecotrack:ecotrack@localhost:5432/ecotrack_test
      ACCESS_TOKEN_SECRET: ci_access_token_secret_key_min_32_chars__01
      REFRESH_TOKEN_SECRET: ci_refresh_token_secret_key_min_32_chars__01
      BCRYPT_SALT_ROUNDS: "10"
      POLICY_VERSION: "1"
      CORS_ORIGIN: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecotrack
          POSTGRES_PASSWORD: ecotrack
          POSTGRES_DB: ecotrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotrack -d ecotrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prisma migrate (test DB)
        run: npx prisma migrate deploy

      - name: Test
        run: npm test -- --coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high
