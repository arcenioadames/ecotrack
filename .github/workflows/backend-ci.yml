name: EcoTrack Backend CI/CD

on:
  pull_request:
    branches: [ main, develop ]
    paths: [ "backend/**", ".github/workflows/backend-ci.yml" ]
  push:
    branches: [ main ]
    paths: [ "backend/**", ".github/workflows/backend-ci.yml" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ecotrack-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ecotrack:ecotrack@localhost:5432/ecotrack_test
      DIRECT_URL: postgresql://ecotrack:ecotrack@localhost:5432/ecotrack_test
      ACCESS_TOKEN_SECRET: ci_access_token_secret_key_min_32_chars__01
      REFRESH_TOKEN_SECRET: ci_refresh_token_secret_key_min_32_chars__01
      BCRYPT_SALT_ROUNDS: "10"
      POLICY_VERSION: "1"
      CORS_ORIGIN: http://localhost:3000
      REFRESH_TOKEN_COOKIE: "0"
      REFRESH_TOKEN_COOKIE_SECURE: "0"
      CI_WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
      CI_WEBHOOK_KIND: ${{ vars.CI_WEBHOOK_KIND }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecotrack
          POSTGRES_PASSWORD: ecotrack
          POSTGRES_DB: ecotrack_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U ecotrack -d ecotrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: Build production bundle
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn

      - name: Send success notification
        if: success() && env.CI_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          MESSAGE="✅ EcoTrack backend CI passed for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          if [ "$CI_WEBHOOK_KIND" = "slack" ]; then
            curl -X POST -H "Content-Type: application/json" --data "{\"text\":\"$MESSAGE\"}" "$CI_WEBHOOK_URL"
          else
            curl -X POST -H "Content-Type: application/json" --data "{\"content\":\"$MESSAGE\"}" "$CI_WEBHOOK_URL"
          fi

      - name: Send failure notification
        if: failure() && env.CI_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          MESSAGE="❌ EcoTrack backend CI failed for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          if [ "$CI_WEBHOOK_KIND" = "slack" ]; then
            curl -X POST -H "Content-Type: application/json" --data "{\"text\":\"$MESSAGE\"}" "$CI_WEBHOOK_URL"
          else
            curl -X POST -H "Content-Type: application/json" --data "{\"content\":\"$MESSAGE\"}" "$CI_WEBHOOK_URL"
          fi
